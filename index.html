<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Lite</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <main class="timer-container" aria-label="Pomodoro Timer">
        <div id="phase-label" class="phase-label">FOCUS TIME</div>
        <div id="timer-display" class="timer-display" role="timer" aria-live="off">50:00</div>
        <div id="focus-hours" class="focus-hours">TOTAL HOURS: 0h</div>
        <nav class="controls-nav" aria-label="Timer controls">
          <button id="btn-start" type="button" class="btn-control">START</button>
          <button id="btn-pause" type="button" class="btn-control">PAUSE</button>
          <button id="btn-reset" type="button" class="btn-control">RESET</button>
        </nav>
      </main>
      <footer class="bg-controls-container" aria-label="Application controls">
        <input
          type="file"
          id="background-upload"
          accept="image/jpeg,image/png,image/webp"
          class="visually-hidden"
          aria-hidden="true"
          tabindex="-1"
        />
        <button id="btn-change-background" type="button" class="btn-control btn-bg-control">CHANGE BACKGROUND</button>
        <button id="btn-remove-background" type="button" class="btn-control btn-bg-control">REMOVE BACKGROUND</button>
        <input
          type="file"
          id="backup-import"
          accept=".json,application/json"
          class="visually-hidden"
          aria-hidden="true"
          tabindex="-1"
        />
        <button id="btn-export-backup" type="button" class="btn-control btn-bg-control">EXPORT BACKUP</button>
        <button id="btn-import-backup" type="button" class="btn-control btn-bg-control">IMPORT BACKUP</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
